# build.yml 定时多架构打包发布 ghcr.io + amd64 离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 参考 /tmp/wb2api-build，适配本仓库（workflow 就住在仓库里，无需双 checkout 覆盖 Dockerfile）。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:00 = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 也触发发布

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.json for build
        run: cp config.example.json config.json

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本注入：容器里的网关要能报出版本，否则面板「检查更新」永远显示开发版。
      # tag 触发用 tag 名，其余用 commit 短 sha（与 release.yml 同一口径）。
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --build-arg VERSION=${{ steps.ver.outputs.version }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_TIME=${{ github.event.head_commit.timestamp }} \
            --tag wb2api:offline --output type=docker,dest=wb2api-amd64.tar .
          gzip -f wb2api-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-amd64
          path: wb2api-amd64.tar.gz
          if-no-files-found: error
